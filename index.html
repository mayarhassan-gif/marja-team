<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d39">
  <title>فريق مَرَجِع</title>
  <style>
    :root { --green:#173d39; --sage:#dce6dc; --cream:#f7f3e9; --ink:#20312e; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; padding:32px 18px;
      font-family:Tahoma, Arial, sans-serif; color:var(--ink);
      background:linear-gradient(145deg,#f7f3e9,#e9eee7);
      display:grid; place-items:center;
    }
    main { width:min(100%,620px); }
    header {
      background:var(--green); color:white; text-align:center;
      padding:42px 24px 36px; border-radius:26px 26px 0 0;
    }
    .mark { font-size:13px; letter-spacing:2px; color:#dce6dc; }
    h1 { font-size:42px; margin:12px 0 8px; }
    header p { margin:0; color:#e5e9df; line-height:1.8; }
    section {
      background:#fffefa; padding:28px 22px 24px;
      border:1px solid #e5e6dc; border-top:0;
      border-radius:0 0 26px 26px; box-shadow:0 18px 50px #173d3915;
    }
    h2 { font-size:19px; margin:0 0 18px; }
    .member {
      display:flex; align-items:center; gap:14px; padding:16px 0;
      border-bottom:1px solid #e9e9e1;
    }
    .member:last-of-type { border-bottom:0; }
    .avatar {
      flex:0 0 48px; height:48px; border-radius:50%;
      background:var(--sage); color:var(--green);
      display:grid; place-items:center; font-size:20px; font-weight:bold;
    }
    .details { flex:1; min-width:0; }
    .name { font-weight:bold; font-size:16px; }
    .role { color:#77827b; font-size:12px; margin-top:5px; }
    a {
      display:inline-block; text-decoration:none; white-space:nowrap;
      background:var(--green); color:white; padding:10px 14px;
      border-radius:999px; font-size:13px; font-weight:bold;
    }
    a:hover { background:#285a52; }
    footer { text-align:center; color:#78827a; font-size:12px; margin-top:22px; }
    @media (max-width:420px) {
      body { padding:18px 12px; }
      section { padding:22px 16px; }
      .member { gap:10px; }
      a { padding:9px 11px; font-size:12px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mark">فريقنا • روابطنا</div>
      <h1>مَرَجِع</h1>
      <p>نلتقي بالمعرفة، ونصنع الأثر معًا</p>
    </header>
    <section>
      <h2>تعرّفوا على عضوات الفريق</h2>
      <div class="member">
        <div class="avatar">ل</div>
        <div class="details">
          <div class="name">لمى عبدالله</div>
          <div class="role">عضوة فريق مَرَجِع</div>
        </div>
        <a href="https://www.linkedin.com/in/lamabdullah-cybersecurity/" target="_blank" rel="noopener noreferrer">حساب LinkedIn ↗</a>
      </div>
      <div class="member">
        <div class="avatar">م</div>
        <div class="details">
          <div class="name">ميار الشهري</div>
          <div class="role">عضوة فريق مَرَجِع</div>
        </div>
        <a href="https://www.linkedin.com/in/mayar-al-shehri-513541376/" target="_blank" rel="noopener noreferrer">حساب LinkedIn ↗</a>
      </div>
      <div class="member">
        <div class="avatar">أ</div>
        <div class="details">
          <div class="name">أماني محمد</div>
          <div class="role">عضوة فريق مَرَجِع</div>
        </div>
        <a href="https://www.linkedin.com/in/amani-mohammed-33454b372/" target="_blank" rel="noopener noreferrer">حساب LinkedIn ↗</a>
      </div>
      <footer>مَرَجِع | فريق يصنع الفرق ✨</footer>
    </section>
  </main>
</body>
</html>
